<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализатор страниц</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Анализатор страниц</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('urls_list') }}">Сайты</a>
            </div>
        </div>
    </nav>

    <!-- Flash -->
    <div class="container mt-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <!-- Секция основного контента -->
    <div class="container mt-3">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-5">
                        <h1 class="card-title text-center mb-3">Анализатор страниц</h1>
                        <p class="text-center text-muted mb-4">
                            Бесплатно проверяйте сайты на SEO-пригодность
                        </p>

                        <!-- Форма анализатора сайта -->
                        <form method="post" action="{{ url_for('index') }}">
                            <div class="mb-3">
                                <input
                                    type="url"
                                    class="form-control form-control-lg"
                                    name="url"
                                    placeholder="https://www.example.com"
                                    required
                                >
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    ПРОВЕРИТЬ
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Футер -->
    <footer class="bg-light mt-5 py-3">
        <div class="container text-center">
            <a href="#" class="text-decoration-none">2026</a>
        </div>
    </footer>

    <!-- Bootstrap JS подключение -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
